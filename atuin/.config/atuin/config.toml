# :: https://docs.atuin.sh/configuration/config/
# Local-only history search, no account/sync.
auto_sync = false

# Never record commands touching *.env.local-style secret files.
history_filter = [
  '\.env[^ ]*\.local',
]

[logs]
dir = "~/.local/state/atuin/logs"

# Daemon had no systemd unit to keep it alive across WSL restarts; a stale
# pidfile after a crash/reboot silently blocked recording with no error.
# Local-only, single-machine use -- daemon batching not worth the failure mode.
[daemon]
enabled = false
