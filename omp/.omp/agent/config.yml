tools:
  approvalMode: yolo
  approval:
    computer: deny
    eval: prompt
bash:
  allowCompoundCommands: true
  patterns:
    - match: "*sops*"
      approval: deny
      reason: "secrets tool: use sops manually, never through the agent"
    - match: "*id_rsa*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*id_ed25519*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*id_ecdsa*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*id_dsa*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*ssh-keygen -lf *github.pub"
      approval: allow
    - match: "*user.signingkey=*github.pub* commit -S*"
      approval: allow
    - match: "*/.ssh/*"
      approval: deny
      reason: "~/.ssh contents: keys and agent data — agent stays out"
    - match: "*/.ssh"
      approval: deny
      reason: "~/.ssh contents: keys and agent data — agent stays out"
    - match: gh pr status*
      approval: allow
    - match: gh secret*
      approval: deny
      reason: "gh secret view reads secret values: run manually"
    - match: gh * view*
      approval: allow
    - match: gh pr list*
      approval: allow
    - match: gh pr checks*
      approval: allow
    - match: gh pr diff*
      approval: allow
    - match: gh pr create*
      approval: allow
    - match: gh pr edit*
      approval: allow
    - match: gh issue list*
      approval: allow
    - match: gh repo list*
      approval: allow
    - match: gh run list*
      approval: allow
    - match: gh workflow list*
      approval: allow
    - match: gh release list*
      approval: allow
    - match: gh label list*
      approval: allow
    - match: gh auth status*
      approval: allow
    - match: gh api *
      approval: deny
      reason: "gh api can do anything with the token: run manually"
    - match: gh auth token*
      approval: deny
      reason: "reads the oauth token: run manually"
    - match: gh auth login*
      approval: deny
      reason: "changes gh auth state: run manually"
    - match: gh auth refresh*
      approval: deny
      reason: "changes gh auth state: run manually"
    - match: gh ssh *
      approval: deny
      reason: "opens a shell on a GitHub host: run manually"
    - match: gh alias *
      approval: deny
      reason: "gh alias: run manually"
    - match: gh extension *
      approval: deny
      reason: "gh extension installs code: run manually"
    - match: gh gist *
      approval: deny
      reason: "gh gist publishes content: run manually"
    - match: gh variable *
      approval: deny
      reason: "repo variables: run manually"
    - match: gh codespace *
      approval: deny
      reason: "spawns machines: run manually"
    - match: gh cache *
      approval: deny
      reason: "gh cache: run manually"
    - match: gh release create*
      approval: deny
      reason: "publishes a release: run manually"
    - match: gh release delete*
      approval: deny
      reason: "deletes a release: run manually"
    - match: gh workflow run*
      approval: deny
      reason: "triggers a workflow: run manually"
    - match: gh pr merge*
      approval: deny
      reason: "merging a PR: run manually"
    - match: gh pr close*
      approval: deny
      reason: "changes PR state: run manually"
    - match: gh pr reopen*
      approval: deny
      reason: "changes PR state: run manually"
    - match: gh pr comment*
      approval: deny
      reason: "posts to GitHub: run manually"
    - match: gh pr ready*
      approval: deny
      reason: "changes PR state: run manually"
    - match: gh issue create*
      approval: deny
      reason: "posts to GitHub: run manually"
    - match: gh issue comment*
      approval: deny
      reason: "posts to GitHub: run manually"
    - match: gh issue close*
      approval: deny
      reason: "changes issue state: run manually"
    - match: gh repo create*
      approval: deny
      reason: "creates a repository: run manually"
    - match: gh repo fork*
      approval: deny
      reason: "forks a repository: run manually"
    - match: gh repo rename*
      approval: deny
      reason: "renames a repository: run manually"
    - match: gh repo archive*
      approval: deny
      reason: "archives a repository: run manually"
    - match: gh release upload*
      approval: deny
      reason: "publishes assets: run manually"
    - match: gh release edit*
      approval: deny
      reason: "changes a release: run manually"
    - match: gh release download*
      approval: deny
      reason: "gh release download: run manually"
    - match: gh label create*
      approval: deny
      reason: "changes repo labels: run manually"
    - match: gh label delete*
      approval: deny
      reason: "changes repo labels: run manually"
    - match: gh workflow enable*
      approval: deny
      reason: "changes workflow state: run manually"
    - match: gh workflow disable*
      approval: deny
      reason: "changes workflow state: run manually"
    - match: gh ruleset *
      approval: deny
      reason: "changes repo rules: run manually"
    - match: gh attestation *
      approval: deny
      reason: "gh attestation: run manually"
    - match: gh copilot *
      approval: deny
      reason: "gh copilot: run manually"
    - match: gh browse*
      approval: deny
      reason: "opens a browser: run manually"
    - match: "*/gh *"
      approval: deny
      reason: "gh outside PATH: run manually"
    - match: "*config/gh/*"
      approval: deny
      reason: "gh config: hosts.yml stores oauth token — agent stays out"
    - match: "*config/gh"
      approval: deny
      reason: "gh config: hosts.yml stores oauth token — agent stays out"
    - match: "*git push * origin main*"
      approval: deny
      reason: "pushing main: run manually"
    - match: "*git push origin main*"
      approval: deny
      reason: "pushing main: run manually"
    - match: "*git push *:main*"
      approval: deny
      reason: "pushing main via refspec: run manually"
    - match: "*git push *+main*"
      approval: deny
      reason: "force-pushing main: run manually"
    - match: "*git push *--all*"
      approval: deny
      reason: "blanket push includes main: run manually"
    - match: "*git push *--mirror*"
      approval: deny
      reason: "mirror push includes main: run manually"
    - match: "*rm -rf /*"
      approval: deny
      reason: recursive delete under /
    - match: "*rm -fr /*"
      approval: deny
      reason: recursive delete under /
    - match: "*rm -rf ~*"
      approval: deny
      reason: recursive delete under home
    - match: "*rm -fr ~*"
      approval: deny
      reason: recursive delete under home
    - match: "*rm -rf $HOME*"
      approval: deny
      reason: recursive delete of home
    - match: "*rm -rf ."
      approval: deny
      reason: recursive delete of cwd
    - match: "*rm -rf .."
      approval: deny
      reason: recursive delete of parent dir
    - match: "*rm -rf .git*"
      approval: deny
      reason: recursive delete of git history
    - match: "*(){ :|:& };:*"
      approval: deny
      reason: fork bomb
    - match: "*mkfs*"
      approval: deny
      reason: filesystem creation/wipe
    - match: "*dd *of=/dev/*"
      approval: deny
      reason: raw write to block device
    - match: "*wipefs*"
      approval: deny
      reason: filesystem signature wipe
    - match: "*fdisk*"
      approval: deny
      reason: partition editing
    - match: "*sgdisk*"
      approval: deny
      reason: partition editing
    - match: "*parted*"
      approval: deny
      reason: partition editing
    - match: "*shutdown*"
      approval: deny
      reason: system shutdown
    - match: "*reboot*"
      approval: deny
      reason: system reboot
    - match: "*poweroff*"
      approval: deny
      reason: system poweroff
    - match: "*halt*"
      approval: deny
      reason: system halt
    - match: "*| sh"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*|sh"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*| bash"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*|bash"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*| sudo sh"
      approval: deny
      reason: pipe to shell as root
    - match: "*| sudo bash"
      approval: deny
      reason: pipe to shell as root
    - match: "*nix-collect-garbage -d*"
      approval: deny
      reason: "deletes old NixOS generations: loses rollback"
    - match: "*npm publish*"
      approval: deny
      reason: "publishes package publicly: run manually"
    - match: "*bun publish*"
      approval: deny
      reason: "publishes package publicly: run manually"
    - match: "*gh repo delete*"
      approval: deny
      reason: "deletes GitHub repo: run manually"
enabledProviders:
  - claude-plugins
theme:
  dark: titanium
  light: light
modelRoles:
  default: openrouter/xiaomi/mimo-v2.6-pro:high
symbolPreset: unicode
composer:
  shape: band
setupVersion: 2