tools:
  approvalMode: yolo
  approval:
    computer: deny
    eval: prompt
bash:
  allowCompoundCommands: true
  patterns:
    - match: "*sops*"
      approval: deny
      reason: "secrets tool: use sops manually, never through the agent"
    - match: "*id_rsa*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*id_ed25519*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*id_ecdsa*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*id_dsa*"
      approval: deny
      reason: "private SSH key material: never read or copy through the agent"
    - match: "*ssh-keygen -lf *github.pub"
      approval: allow
    - match: "*user.signingkey=*github.pub* commit -S*"
      approval: allow
    - match: "*/.ssh/*"
      approval: deny
      reason: "~/.ssh contents: keys and agent data — agent stays out"
    - match: "*/.ssh"
      approval: deny
      reason: "~/.ssh contents: keys and agent data — agent stays out"
    - match: gh pr status*
      approval: allow
    - match: "gh secret*"
      approval: deny
      reason: "gh secret view reads secret values: run manually"
    - match: gh * view*
      approval: allow
    - match: gh pr list*
      approval: allow
    - match: gh pr checks*
      approval: allow
    - match: gh pr diff*
      approval: allow
    - match: gh pr create*
      approval: allow
    - match: gh pr edit*
      approval: allow
    - match: gh issue list*
      approval: allow
    - match: gh repo list*
      approval: allow
    - match: gh run list*
      approval: allow
    - match: gh workflow list*
      approval: allow
    - match: gh release list*
      approval: allow
    - match: gh label list*
      approval: allow
    - match: gh auth status*
      approval: allow
    - match: gh *
      approval: deny
      reason: "gh beyond read-only: run manually (token, mutations, deletes)"
    - match: "*/gh *"
      approval: deny
      reason: "gh beyond read-only: run manually (token, mutations, deletes)"
    - match: "*config/gh/*"
      approval: deny
      reason: "gh config: hosts.yml stores oauth token — agent stays out"
    - match: "*config/gh"
      approval: deny
      reason: "gh config: hosts.yml stores oauth token — agent stays out"
    - match: "*git push * origin main*"
      approval: deny
      reason: "pushing main: run manually"
    - match: "*git push origin main*"
      approval: deny
      reason: "pushing main: run manually"
    - match: "*git push *:main*"
      approval: deny
      reason: "pushing main via refspec: run manually"
    - match: "*git push *+main*"
      approval: deny
      reason: "force-pushing main: run manually"
    - match: "*git push *--all*"
      approval: deny
      reason: "blanket push includes main: run manually"
    - match: "*git push *--mirror*"
      approval: deny
      reason: "mirror push includes main: run manually"
    - match: "*rm -rf /*"
      approval: deny
      reason: recursive delete under /
    - match: "*rm -fr /*"
      approval: deny
      reason: recursive delete under /
    - match: "*rm -rf ~*"
      approval: deny
      reason: recursive delete under home
    - match: "*rm -fr ~*"
      approval: deny
      reason: recursive delete under home
    - match: "*rm -rf $HOME*"
      approval: deny
      reason: recursive delete of home
    - match: "*rm -rf ."
      approval: deny
      reason: recursive delete of cwd
    - match: "*rm -rf .."
      approval: deny
      reason: recursive delete of parent dir
    - match: "*rm -rf .git*"
      approval: deny
      reason: recursive delete of git history
    - match: "*(){ :|:& };:*"
      approval: deny
      reason: fork bomb
    - match: "*mkfs*"
      approval: deny
      reason: filesystem creation/wipe
    - match: "*dd *of=/dev/*"
      approval: deny
      reason: raw write to block device
    - match: "*wipefs*"
      approval: deny
      reason: filesystem signature wipe
    - match: "*fdisk*"
      approval: deny
      reason: partition editing
    - match: "*sgdisk*"
      approval: deny
      reason: partition editing
    - match: "*parted*"
      approval: deny
      reason: partition editing
    - match: "*shutdown*"
      approval: deny
      reason: system shutdown
    - match: "*reboot*"
      approval: deny
      reason: system reboot
    - match: "*poweroff*"
      approval: deny
      reason: system poweroff
    - match: "*halt*"
      approval: deny
      reason: system halt
    - match: "*| sh"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*|sh"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*| bash"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*|bash"
      approval: deny
      reason: "pipe to shell: unreviewed remote code exec"
    - match: "*| sudo sh"
      approval: deny
      reason: pipe to shell as root
    - match: "*| sudo bash"
      approval: deny
      reason: pipe to shell as root
    - match: "*nix-collect-garbage -d*"
      approval: deny
      reason: "deletes old NixOS generations: loses rollback"
    - match: "*npm publish*"
      approval: deny
      reason: "publishes package publicly: run manually"
    - match: "*bun publish*"
      approval: deny
      reason: "publishes package publicly: run manually"
    - match: "*gh repo delete*"
      approval: deny
      reason: "deletes GitHub repo: run manually"
enabledProviders:
  - claude-plugins
theme:
  dark: titanium
  light: light
modelRoles:
  default: openrouter/xiaomi/mimo-v2.6-pro:high
symbolPreset: unicode
composer:
  shape: band
setupVersion: 2